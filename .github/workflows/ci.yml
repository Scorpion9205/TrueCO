name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Prepare environment file
        run: cp apps/api/.env.example apps/api/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Build packages
        run: pnpm run build

      # After the build: type-aware rules need the generated Prisma client and built shared types
      - name: Lint
        run: pnpm run lint

      - name: Run Unit Tests
        run: pnpm run test:unit

      - name: Typecheck web app and API client
        run: pnpm -r --if-present run typecheck

      - name: Run Web Tests
        run: pnpm --filter @trueco/web run test

  security:
    name: Secret Scan & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Blocks on high/critical advisories in the API's production dependencies
      - name: Audit API dependencies
        run: |
          pnpm audit --prod --json > audit.json || true
          node infra/ci/audit-api.mjs < audit.json

  delivery:
    name: Docker Image & Deployment Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          load: true
          tags: trueco-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image starts and runs compiled code
        run: docker run --rm --entrypoint node trueco-api:ci -e "require('fs').accessSync('dist/main.js'); require('fs').accessSync('dist/workers/worker-runner.js'); require('fs').accessSync('dist/database/prisma/migrations')"

      - name: Validate docker-compose file
        run: |
          node infra/docker/generate-compose-env.mjs
          docker compose --env-file infra/docker/compose.env -f infra/docker/docker-compose.yml config --quiet

      - name: Render Kubernetes manifests
        run: kubectl kustomize infra/k8s > /dev/null

  integration:
    name: Integration Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trueco_owner
          POSTGRES_PASSWORD: owner_ci_password
          POSTGRES_DB: trueco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trueco_owner -d trueco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Owner runs migrations and fixtures; the API under test uses the non-superuser app role,
      # because PostgreSQL skips row-level security for superusers.
      TEST_DATABASE_OWNER_URL: postgresql://trueco_owner:owner_ci_password@localhost:5432/trueco_test
      TEST_DATABASE_URL: postgresql://trueco_app:app_ci_password@localhost:5432/trueco_test
      DATABASE_URL: postgresql://trueco_app:app_ci_password@localhost:5432/trueco_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Prepare environment file
        run: cp apps/api/.env.example apps/api/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & build shared types
        run: |
          pnpm run prisma:generate
          pnpm --filter @trueco/types build

      - name: Apply migrations (as schema owner)
        run: pnpm run prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_OWNER_URL }}

      - name: Create application role
        run: psql "$TEST_DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -v app_password=app_ci_password -f infra/docker/postgres/create-app-role.sql

      - name: Seed RBAC roles, permissions and plans
        run: pnpm --filter @trueco/api run db:seed:rbac
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_OWNER_URL }}

      - name: Run Integration Tests
        run: pnpm run test:integration
