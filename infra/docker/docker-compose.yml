name: TrueCo

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trueco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trueco_user
      POSTGRES_PASSWORD: trueco_password
      POSTGRES_DB: trueco_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trueco_user -d trueco_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trueco-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bullmq:
    image: deadly0/bull-board:latest
    container_name: trueco-bullmq
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_VERSION: BULLMQ
      BULL_PREFIX: bull
    ports:
      - "3001:3000"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: trueco-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://trueco_user:trueco_password@postgres:5432/trueco_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-insecure-jwt-secret-for-local-testing-only-32bytes-min
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    container_name: trueco-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://trueco_user:trueco_password@postgres:5432/trueco_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
