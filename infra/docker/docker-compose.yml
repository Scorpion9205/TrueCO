# Production-mode Vargly stack for local use.
#
#   node infra/docker/generate-compose-env.mjs        # once: secrets + JWT keypair (git-ignored)
#   pnpm docker:up                                    # build and start everything
#
# Order: postgres/redis -> migrate (migrations + RBAC seed, as the owner) -> api + worker (as the
# non-superuser app role, so row-level security is enforced). Ports are bound to localhost only;
# override them with POSTGRES_HOST_PORT, REDIS_HOST_PORT, API_HOST_PORT, BULL_BOARD_HOST_PORT.
name: vargly-stack

x-app: &app
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  image: vargly-api:local
  env_file: compose.env
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://vargly_app:${APP_DB_PASSWORD}@postgres:5432/vargly_db?schema=public
    REDIS_HOST: redis
    REDIS_PORT: 6379
    RUN_WORKERS_IN_API: 'false'
    FRONTEND_URL: http://localhost:3000
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vargly_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vargly_db
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/create-app-role.sql:/opt/vargly/create-app-role.sql:ro
      - ./postgres/10-create-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vargly_owner -d vargly_db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - queue_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations and seeds roles/permissions/plans as the schema owner
  migrate:
    <<: *app
    restart: 'no'
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://vargly_owner:${POSTGRES_PASSWORD}@postgres:5432/vargly_db?schema=public
    command:
      - sh
      - -c
      - npx prisma migrate deploy --schema=dist/database/prisma/schema.prisma && node dist/database/prisma/init-rbac.js
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ['node', 'dist/workers/worker-runner.js']
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Queue dashboard (no authentication): localhost only
  bull-board:
    image: deadly0/bull-board:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_VERSION: BULLMQ
      BULL_PREFIX: bull
    ports:
      - '127.0.0.1:${BULL_BOARD_HOST_PORT:-3001}:3000'

# Named differently from the pre-Phase-6 compose file's volumes (postgres_data, redis_data), so an
# existing local database from that setup is left untouched rather than silently reused.
volumes:
  db_data:
  queue_data:
