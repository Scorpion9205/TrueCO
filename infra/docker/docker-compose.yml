name: TrueCo

services:
  postgres:
    image: postgres:16-alpine
    container_name: trueco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trueco_user
      POSTGRES_PASSWORD: trueco_password
      POSTGRES_DB: trueco_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trueco_user -d trueco_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trueco-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bullmq:
    image: deadly0/bull-board:latest
    container_name: trueco-bullmq
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_VERSION: BULLMQ
      BULL_PREFIX: bull
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  redis_data:
