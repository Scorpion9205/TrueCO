# TEMPLATE ONLY: copy, fill in and create out-of-band (kubectl create secret, sealed-secrets or
# external-secrets). Never commit real values. Keys marked * are required: the API refuses to
# start without them.
apiVersion: v1
kind: Secret
metadata:
  name: trueco-secrets
type: Opaque
stringData:
  # * Application role (non-superuser; see infra/docker/postgres/create-app-role.sql)
  DATABASE_URL: postgresql://trueco_app:CHANGE_ME@postgres:5432/trueco_db?schema=public
  # Schema owner, used only by the migration job
  MIGRATION_DATABASE_URL: postgresql://trueco_owner:CHANGE_ME@postgres:5432/trueco_db?schema=public
  REDIS_PASSWORD: ''
  JWT_ACCESS_SECRET: CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG # *
  JWT_REFRESH_SECRET: CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG # *
  DATABASE_ENCRYPTION_KEY: CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG # *
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG # *
  JWT_PRIVATE_KEY: CHANGE_ME_PEM_WITH_NEWLINES_ESCAPED # *
  JWT_PUBLIC_KEY: CHANGE_ME_PEM_WITH_NEWLINES_ESCAPED # *
  METRICS_TOKEN: CHANGE_ME
  WHATSAPP_PHONE_NUMBER_ID: ''
  WHATSAPP_API_TOKEN: ''
  WHATSAPP_APP_SECRET: ''
  SMTP_HOST: ''
  SMTP_USER: ''
  SMTP_PASS: ''
  RAZORPAY_KEY_ID: ''
  RAZORPAY_KEY_SECRET: ''
  RAZORPAY_WEBHOOK_SECRET: ''
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  GEMINI_API_KEY: ''
