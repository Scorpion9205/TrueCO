# Non-secret settings shared by the API, worker and migration job
apiVersion: v1
kind: ConfigMap
metadata:
  name: vargly-config
  labels:
    # Applied (and, for the job, awaited) before the deployments; see docs/RUNBOOK.md
    vargly/stage: pre
data:
  NODE_ENV: production
  PORT: '4000'
  # One ingress/load balancer in front of the API; set to the real number of proxy hops
  TRUST_PROXY: '1'
  RUN_WORKERS_IN_API: 'false'
  REDIS_HOST: vargly-redis
  REDIS_PORT: '6379'
  FRONTEND_URL: https://app.vargly.in
  API_BASE_URL: https://api.vargly.in
  CORS_ORIGIN: https://app.vargly.in
  LOG_LEVEL: info
