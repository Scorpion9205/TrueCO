apiVersion: apps/v1
kind: Deployment
metadata:
  name: trueco-api
  labels:
    app: trueco-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trueco-api
  template:
    metadata:
      labels:
        app: trueco-api
    spec:
      containers:
        - name: api
          image: trueco/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: trueco-config
            - secretRef:
                name: trueco-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: trueco-api-service
spec:
  selector:
    app: trueco-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4000
