# Background workers (queues, event relay, reminders). No HTTP server: the process exits on a
# fatal error and Kubernetes restarts it. Scale replicas for queue throughput; jobs and the
# event relay are safe to run on several replicas at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trueco-worker
  labels:
    app: trueco-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trueco-worker
  template:
    metadata:
      labels:
        app: trueco-worker
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: trueco-api
          command: ['node', 'dist/workers/worker-runner.js']
          envFrom:
            - configMapRef:
                name: trueco-config
            - secretRef:
                name: trueco-secrets
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
