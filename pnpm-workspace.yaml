packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': set this to true or false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': set this to true or false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  msw: set this to true or false
  prisma: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'argon2'
  - 'esbuild'
  - 'prisma'
  - 'msgpackr-extract'
